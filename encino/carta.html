<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menú — Restaurante Encino</title>
<style id="cartaCss"></style>
<style>.c-nav{text-align:center;padding:0 16px 32px;font:.9rem system-ui,sans-serif;color:#7a7466;position:relative;z-index:1}.c-nav a{color:inherit}</style>
</head>
<body>
<div id="app"><div style="text-align:center;padding:60px 16px;font-family:system-ui;color:#7a7466">Cargando menú…</div></div>
<nav class="c-nav" aria-label="Sitio"><a href="/">Inicio</a><!--recetas--> · <a href="/recetas/">Recetas</a><!--/recetas--> · <a href="pedidos.html">Ordenar en línea</a></nav>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script src="comun.js"></script>
<script>
(function(){
  document.getElementById('cartaCss').textContent = Encino.CARTA_CSS;
  var menu = [], cfg = Encino.cfgFrom([]);
  function pinta(){
    document.title = 'Menú — ' + cfg.nombre;
    var link = cfg.pedidosActivos ? 'pedidos.html' : '';
    document.getElementById('app').innerHTML = Encino.cartaBody(cfg, menu, { linkPedidos: link });
    window.cartaAuto(); // respeta el menú que el cliente ya eligió
  }
  (new Function(Encino.CARTA_JS))();
  Store.init().then(function(){
    Store.watch('config', function(d){ cfg = Encino.cfgFrom(d); pinta(); });
    Store.watch('menu', function(d){ menu = d; pinta(); });
  });
})();
</script>
</body>
</html>
