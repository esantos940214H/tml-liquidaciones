<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Encino — Administración</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#26251f;--mut:#76705f;--acc:#4f6b3a;--acc-ink:#fff;--acc-soft:#e3ead9;--line:#e0d8c8;--warn:#b7791f;--warn-soft:#fbefd9;--bad:#a23b2a;--bad-soft:#f7e1dc;--ok:#2f7d4f;--busy:#8a5a2b;--busy-soft:#f3e4d2}
@media (prefers-color-scheme:dark){:root{--bg:#151813;--card:#1e221b;--ink:#ebe7dd;--mut:#a39d8c;--acc:#9fbe85;--acc-ink:#151813;--acc-soft:#2c3626;--line:#343a2f;--warn:#e0b060;--warn-soft:#3a3020;--bad:#e08b7a;--bad-soft:#3d2520;--ok:#7fcf9c;--busy:#e0a86a;--busy-soft:#3a2c1e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{margin:0;font:700 1.25rem Georgia,serif;color:var(--acc)}
nav{display:flex;gap:4px;overflow-x:auto;flex:1}
nav button{border:0;background:transparent;color:var(--ink);padding:8px 12px;border-radius:8px;font:600 .9rem system-ui;cursor:pointer;white-space:nowrap;position:relative}
nav button.on{background:var(--acc-soft);color:var(--acc)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:.72rem;line-height:18px;text-align:center;margin-left:4px}
.modo{font-size:.75rem;color:var(--mut)}
main{padding:16px;max-width:1280px;margin:0 auto}
h2{margin:0 0 12px;font-size:1.2rem}
h3{margin:18px 0 8px;font-size:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .sp{flex:1}
button.b,a.b,label.b{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:8px;font:600 .88rem system-ui;cursor:pointer;text-decoration:none}
button.b.p{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
button.b.d{color:var(--bad);border-color:var(--bad)}
button.b.s{padding:4px 8px;font-size:.8rem}
button.b:disabled{opacity:.45;cursor:default}
input,select,textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;min-width:0}
label.f{display:block;font-size:.78rem;color:var(--mut);margin:8px 0 3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.w100{width:100%}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);border-bottom:1px solid var(--line);padding:6px 8px}
td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
.tw{overflow-x:auto}
.mut{color:var(--mut)}.small{font-size:.8rem}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.75rem;font-weight:600;background:var(--acc-soft);color:var(--acc)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.busy{background:var(--busy-soft);color:var(--busy)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .v{font-size:1.4rem;font-weight:700}.kpi .l{font-size:.78rem;color:var(--mut)}
/* Mesas */
.mesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.mesa{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;color:var(--ink);font:inherit}
.mesa .num{font-size:1.6rem;font-weight:800}
.mesa.oc{border-color:var(--busy);background:var(--busy-soft)}
.mesa .t{font-weight:700}.mesa .x{font-size:.75rem;color:var(--mut)}
/* Modales */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;z-index:20}
.md{background:var(--card);border-radius:14px;width:100%;max-width:560px;padding:18px;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.md.wide{max-width:1180px}
.md .cx{position:absolute;top:10px;right:10px;border:0;background:transparent;font-size:1.4rem;cursor:pointer;color:var(--mut)}
.md h2{padding-right:30px}
.md .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
/* Orden */
.ord{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
@media (max-width:820px){.ord{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 11px;font:600 .8rem system-ui;cursor:pointer}
.chips button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;max-height:60vh;overflow-y:auto;padding:2px}
.item{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;text-align:left;cursor:pointer;color:var(--ink);font:inherit}
.item:hover{border-color:var(--acc)}
.item .nm{font-weight:600;font-size:.88rem}.item .pr{color:var(--acc);font-weight:700;font-size:.85rem}
.item.beb{border-left:4px solid #4a78a8}
.item.off{opacity:.4}
.cuenta{background:var(--bg);border-radius:12px;padding:12px}
.ln{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.ln .nm{flex:1;font-size:.9rem}.ln .nt{display:block;font-size:.75rem;color:var(--warn)}
.ln .q{display:flex;align-items:center;gap:4px}
.ln .q button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tot{display:flex;justify-content:space-between;font-size:1.3rem;font-weight:800;margin:12px 0}
.bar{height:10px;background:var(--acc);border-radius:5px;min-width:2px}
.ticket td{border:0;padding:1px 0}.ticket .c{text-align:center}.ticket .r{text-align:right}.ticket .b{font-weight:bold}.ticket .g{font-size:14px}.ticket hr{border:0;border-top:1px dashed #000;margin:4px 0}.ticket table{font-size:12px}
.ticket{background:#fff;color:#000;font:12px/1.3 "Courier New",monospace;padding:12px;border:1px solid var(--line);max-width:320px;margin:0 auto;white-space:normal}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.ped{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);margin-bottom:10px}
.ped.nuevo{border:2px solid var(--bad)}
#login{max-width:360px;margin:60px auto}
.qr{background:#fff;padding:10px;display:inline-block;border-radius:8px}
.mapaCfg{height:280px;border-radius:10px;border:1px solid var(--line);z-index:0}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>
<body>
<header>
  <h1>🌳 Encino</h1>
  <nav id="nav">
    <button data-t="mesas" class="on">🍽️ Mesas</button>
    <button data-t="pedidos">🌐 Pedidos en línea <span id="bPed"></span></button>
    <button data-t="menu">📋 Menú</button>
    <button data-t="inventario">📦 Inventario <span id="bInv"></span></button>
    <button data-t="compras">🛒 Compras</button>
    <button data-t="historicos">📈 Históricos</button>
    <button data-t="config">⚙️ Configuración</button>
  </nav>
  <span class="modo" id="modo"></span>
</header>
<main id="main"><p class="mut">Cargando…</p></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script src="comun.js"></script>
<script>
(function(){
'use strict';
window.ENCINO_PERSISTENCIA = true;
var E = Encino, esc = E.esc, money = E.money, dkey = E.dkey;
var $ = function(id){ return document.getElementById(id); };
function num(v){ if (v == null || v === '') return null; var n = parseFloat(String(v).replace(/[$,\s]/g, '')); return isFinite(n) ? n : null; }
function r2(n){ return Math.round((Number(n) || 0) * 100) / 100; }
function fmtCant(n){ n = Number(n) || 0; return Math.abs(n % 1) < 1e-9 ? String(n) : n.toFixed(3).replace(/0+$/, ''); }
function fecha(ts){ return new Date(ts).toLocaleString('es-MX', { dateStyle: 'short', timeStyle: 'short' }); }
function toast(msg, ms){ var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, ms || 2600); }
// Cualquier error que antes pasaba en silencio (p. ej. un guardado rechazado)
// se muestra en pantalla para poder saber qué pasó.
function errTxt(e){ return (e && (e.code ? e.code + ': ' : '') + (e.message || e)) || 'desconocido'; }
window.addEventListener('unhandledrejection', function(ev){ toast('⚠️ Error: ' + errTxt(ev.reason), 8000); });
window.addEventListener('error', function(ev){ toast('⚠️ Error: ' + (ev.message || 'desconocido'), 8000); });

// ── Estado (se llena desde Store.watch) ────────────────────────────────
var S = { menu: [], insumos: [], ordenes: [], ventas: [], movimientos: [], compras: [], pedidos: [], preparaciones: [], configDocs: [], config: E.cfgFrom([]) };
var TAB = 'mesas', listo = false;

// ── Modales ─────────────────────────────────────────────────────────────
function modal(html, opts){
  opts = opts || {};
  var ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = '<div class="md' + (opts.wide ? ' wide' : '') + '"><button class="cx" title="Cerrar">×</button>' + html + '</div>';
  var md = ov.firstChild;
  md.close = function(){ ov.remove(); if (opts.onClose) opts.onClose(); };
  md.querySelector('.cx').onclick = md.close;
  ov.addEventListener('mousedown', function(e){ if (e.target === ov && !opts.sticky) md.close(); });
  document.body.appendChild(ov);
  return md;
}

// ── Impresión (ticket / comanda) en iframe oculto ──────────────────────
function imprimir(html){
  var w = S.config.anchoTicket == 58 ? 48 : 72;
  var css = '@page{size:' + (w + 8) + 'mm auto;margin:0}body{width:' + w + 'mm;margin:0 auto;padding:3mm 0;font:12px/1.3 "Courier New",monospace;color:#000}' +
    '.c{text-align:center}.r{text-align:right}.b{font-weight:bold}.g{font-size:15px}hr{border:0;border-top:1px dashed #000;margin:4px 0}table{width:100%;border-collapse:collapse}td{padding:1px 0;vertical-align:top;border:0}';
  // Se imprime la misma página mostrando solo el ticket (los navegadores de
  // celular no imprimen desde un iframe oculto).
  var zona = document.getElementById('zonaImpresion');
  if (!zona) { zona = document.createElement('div'); zona.id = 'zonaImpresion'; document.body.appendChild(zona); }
  var st = document.getElementById('estiloImpresion');
  if (!st) { st = document.createElement('style'); st.id = 'estiloImpresion'; document.head.appendChild(st); }
  st.textContent = '#zonaImpresion{display:none}@media print{' + css.replace(/(^|\})\s*([^@{}][^{}]*)\{/g, function(m, a, sel){ return a + sel.split(',').map(function(x){ x = x.trim(); return x === 'body' ? 'body' : '#zonaImpresion ' + x; }).join(',') + '{'; }) +
    'body>*:not(#zonaImpresion){display:none!important}#zonaImpresion{display:block!important}html,body{background:#fff!important}}';
  zona.innerHTML = html;
  setTimeout(function(){ try { window.print(); } catch(e){ toast('No se pudo abrir la impresión: ' + e.message); } }, 50);
}
function ticketHTML(v){
  var c = S.config, h = '<div class="c b g">' + esc(c.nombre) + '</div>';
  [c.direccion, c.telefono ? 'Tel. ' + c.telefono : '', c.rfc ? 'RFC ' + c.rfc : ''].filter(Boolean).forEach(function(x){ h += '<div class="c">' + esc(x) + '</div>'; });
  h += '<hr><div>Ticket: <b>' + v.folio + '</b></div><div>' + esc(fecha(v.fecha)) + '</div><div>' + esc(etiquetaOrden(v)) + (v.personas ? ' · ' + v.personas + ' pers.' : '') + '</div>';
  if (v.mesero) h += '<div>Atendió: ' + esc(v.mesero) + '</div>';
  if (v.estado === 'cancelada') h += '<div class="c b">*** CANCELADO ***</div>';
  h += '<hr><table>';
  v.items.forEach(function(i){
    h += '<tr><td>' + i.cant + ' ' + esc(i.nombre) + (i.nota ? '<br>&nbsp;&nbsp;(' + esc(i.nota) + ')' : '') + '</td><td class="r">' + money(i.precio * i.cant) + '</td></tr>';
  });
  h += '</table><hr><table><tr><td>Subtotal</td><td class="r">' + money(v.subtotal) + '</td></tr>';
  if (v.descuento) h += '<tr><td>Descuento ' + (v.descPct ? v.descPct + '%' : '') + '</td><td class="r">-' + money(v.descuento) + '</td></tr>';
  var base = v.subtotal - (v.descuento || 0);
  h += '<tr><td class="b g">TOTAL</td><td class="r b g">' + money(base) + '</td></tr>';
  if (v.propina) h += '<tr><td>Propina</td><td class="r">' + money(v.propina) + '</td></tr><tr><td class="b">Total con propina</td><td class="r b">' + money(v.total) + '</td></tr>';
  h += '<tr><td>Pago: ' + esc(v.metodo) + '</td><td class="r">' + (v.pagoCon ? money(v.pagoCon) : '') + '</td></tr>';
  if (v.cambio) h += '<tr><td>Cambio</td><td class="r">' + money(v.cambio) + '</td></tr>';
  h += '</table><div class="c" style="margin-top:4px;font-size:10px">IVA incluido: ' + money(base - base / 1.16) + '</div><hr>';
  if (c.leyenda) h += '<div class="c">' + esc(c.leyenda) + '</div>';
  return h;
}
function etiquetaOrden(o){
  if (o.tipo === 'mesa') return 'Mesa ' + o.mesa;
  if (o.tipo === 'linea') return 'En línea: ' + (o.cliente || '');
  return 'Para llevar' + (o.cliente ? ': ' + o.cliente : '');
}

// ── Navegación ──────────────────────────────────────────────────────────
$('nav').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  TAB = b.dataset.t;
  document.querySelectorAll('#nav button').forEach(function(x){ x.classList.toggle('on', x === b); });
  render(true);
});
function render(forzar){
  if (!listo) return;
  badges();
  // Configuración tiene un formulario largo: solo se redibuja al entrar,
  // para no borrar lo que la persona esté escribiendo.
  if (TAB === 'config' && !forzar) return;
  var f = { mesas: vMesas, pedidos: vPedidos, menu: vMenu, inventario: vInventario, compras: vCompras, historicos: vHistoricos, config: vConfig }[TAB];
  var y = window.scrollY; f(); if (!forzar) window.scrollTo(0, y);
}
function badges(){
  var np = S.pedidos.filter(function(p){ return p.estado === 'nuevo'; }).length;
  var nb = S.insumos.filter(bajo).length;
  $('bPed').innerHTML = np ? '<span class="badge">' + np + '</span>' : '';
  $('bInv').innerHTML = nb ? '<span class="badge" style="background:var(--warn)">' + nb + '</span>' : '';
}
function bajo(i){ return i.minimo != null && i.minimo !== '' && (Number(i.existencia) || 0) <= Number(i.minimo); }

// ═════════════════════════ MESAS / ÓRDENES ═════════════════════════════
function totalOrden(o){ return (o.items || []).reduce(function(s, i){ return s + i.precio * i.cant; }, 0); }
function getOrden(id){ return S.ordenes.find(function(o){ return o.id === id; }); }
function minutos(ts){ var m = Math.round((Date.now() - ts) / 60000); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min'; }

function vMesas(){
  var n = parseInt(S.config.mesas, 10) || 10, h = '<div class="toolbar"><h2 style="margin:0">Mesas</h2><span class="sp"></span><button class="b p" id="nLlevar">🥡 Nueva orden para llevar</button></div><div class="mesas">';
  for (var i = 1; i <= n; i++) {
    var o = S.ordenes.find(function(x){ return x.tipo === 'mesa' && x.mesa === String(i); });
    h += '<button class="mesa' + (o ? ' oc' : '') + '" data-mesa="' + i + '"><div class="x">Mesa</div><div class="num">' + i + '</div>' +
      (o ? '<div class="t">' + money(totalOrden(o)) + '</div><div class="x">' + minutos(o.abierta) + (o.mesero ? ' · ' + esc(o.mesero) : '') + '</div>' : '<div class="x">Libre</div>') + '</button>';
  }
  h += '</div>';
  var otras = S.ordenes.filter(function(x){ return x.tipo !== 'mesa'; }).sort(function(a, b){ return a.abierta - b.abierta; });
  h += '<h3>Para llevar / en línea</h3>';
  if (!otras.length) h += '<p class="mut">No hay órdenes abiertas.</p>';
  else {
    h += '<div class="mesas">';
    otras.forEach(function(o){ h += '<button class="mesa oc" data-orden="' + o.id + '"><div class="x">' + (o.tipo === 'linea' ? '🌐 En línea' : '🥡 Llevar') + '</div><div class="t">' + esc(o.cliente || '—') + '</div><div class="t">' + money(totalOrden(o)) + '</div><div class="x">' + minutos(o.abierta) + '</div></button>'; });
    h += '</div>';
  }
  $('main').innerHTML = h;
  $('nLlevar').onclick = function(){
    var cli = prompt('Nombre del cliente (opcional):', ''); if (cli === null) return;
    var o = { id: Store.uid(), tipo: 'llevar', mesa: '', cliente: cli.trim(), items: [], abierta: Date.now() };
    Store.put('ordenes', o).then(function(){ abrirOrden(o.id); });
  };
  $('main').querySelectorAll('[data-mesa]').forEach(function(b){ b.onclick = function(){ abrirMesa(b.dataset.mesa); }; });
  $('main').querySelectorAll('[data-orden]').forEach(function(b){ b.onclick = function(){ abrirOrden(b.dataset.orden); }; });
}
function abrirMesa(m){
  var o = S.ordenes.find(function(x){ return x.tipo === 'mesa' && x.mesa === String(m); });
  if (o) return abrirOrden(o.id);
  o = { id: Store.uid(), tipo: 'mesa', mesa: String(m), items: [], abierta: Date.now(), mesero: localStorage.getItem('encino:mesero') || '' };
  Store.put('ordenes', o).then(function(){ abrirOrden(o.id); });
}

var OM = null; // modal de la orden abierta
var oFiltro = { cat: 'Todo', q: '', menu: '' };
function abrirOrden(id){
  var o = getOrden(id); if (!o) return;
  var act = E.menuActual(S.config);
  // En la ventana de cambio (dos menús en horario) se muestran todos
  oFiltro = { cat: 'Todo', q: '', menu: E.menusActivos(S.config).length > 1 ? '' : (act ? act.id : '') };
  OM = modal('<h2 id="oTit"></h2><div class="ord"><div><div class="toolbar" style="margin:0"><input id="oQ" placeholder="🔎 Buscar platillo o bebida…" style="flex:1"><select id="oMenu"><option value="">Todos los menús</option>' +
    S.config.menus.map(function(m){ return '<option value="' + esc(m.id) + '">' + esc(E.menuEtiqueta(m)) + '</option>'; }).join('') + '</select></div><div class="chips" id="oCats"></div><div class="items" id="oItems"></div></div>' +
    '<div class="cuenta"><div class="grid2"><div><label class="f">Mesero</label><input id="oMesero" class="w100"></div><div><label class="f">Personas</label><input id="oPers" type="number" min="1" class="w100"></div></div>' +
    '<div id="oLines" style="margin-top:8px"></div><div class="tot"><span>Total</span><span id="oTot"></span></div>' +
    '<div class="toolbar"><button class="b" id="oComanda">🧾 Enviar comanda</button><button class="b" id="oCambiar">↔️ Cambiar mesa</button><button class="b d" id="oCancelar">Cancelar orden</button><span class="sp"></span><button class="b p" id="oCobrar">💵 Cobrar</button></div></div></div>',
    { wide: true, onClose: function(){ OM = null; } });
  OM.dataset.id = id;
  $('oMenu').value = oFiltro.menu;
  $('oQ').oninput = function(){ oFiltro.q = this.value.toLowerCase(); pintaItems(); };
  $('oMenu').onchange = function(){ oFiltro.menu = this.value; pintaItems(); };
  $('oMesero').value = o.mesero || ''; $('oPers').value = o.personas || '';
  $('oMesero').onchange = function(){ try { localStorage.setItem('encino:mesero', this.value); } catch(e){} Store.put('ordenes', { id: id, mesero: this.value.trim() }); };

function pintaItems(){

  var cats = ['Todo', 'Alimentos', 'Bebidas'].concat(E.porCategoria(base.filter(function(i){ return !i.esPaquete && i.categoria; }), S.config.categorias).map(function(g){ return g.categoria; }));

  var its = base.filter(function(i){

    if (['Todo', 'Alimentos', 'Bebidas'].indexOf(oFiltro.cat) < 0 && E.catDe(i) !== oFiltro.cat) return false;

      (st != null ? '<div class="small ' + (st <= 0 ? 'mut' : 'mut') + '">' + (st <= 0 ? '⚠️ sin existencia' : 'quedan ' + st) + '</div>' : '') + '</button>';

// Cuántas porciones alcanzan con la existencia actual (solo si tiene receta)
function stockPlatillo(m){
  if (!m.receta || !m.receta.length) return null;
  var min = Infinity;
  m.receta.forEach(function(r){ var ins = S.insumos.find(function(x){ return x.id === r.insumoId; }); if (ins && r.cant > 0) min = Math.min(min, Math.floor((Number(ins.existencia) || 0) / r.cant)); });
  return min === Infinity ? null : Math.max(0, min);
}

function agregar(menuId){

    vs.map(function(v){ return '<button class="item" data-v="' + esc(v.id) + '"><div class="nm">' + esc(v.nombre) + '</div><div class="pr">' + money(v.precio) + '</div></button>'; }).join('') + '</div>');
  $('vSel').onclick = function(e){ var b = e.target.closest('[data-v]'); if (!b) return; md.close(); agregarLinea(m, vs.find(function(v){ return v.id === b.dataset.v; })); };

function agregarLinea(m, v){

function accionLinea(a, lid){
  var o = getOrden(OM.dataset.id); if (!o) return;
  var items = (o.items || []).map(function(x){ return Object.assign({}, x); }), l = items.find(function(x){ return x.lid === lid; });

// Agrega un paquete (ej. café, pan y jugo o fruta) ligado a un platillo de la orden

function comanda(){

// ── Cobro ───────────────────────────────────────────────────────────────
function cobrar(){
  var o = getOrden(OM.dataset.id); if (!o) return;
  if (!(o.items || []).length) return alert('La orden no tiene nada que cobrar.');
  var sub = r2(totalOrden(o));
  var md = modal('<h2>Cobrar · ' + esc(etiquetaOrden(o)) + '</h2><div class="tot"><span>Subtotal</span><span>' + money(sub) + '</span></div>' +
    '<div class="grid2"><div><label class="f">Descuento %</label><input id="cDesc" type="number" min="0" max="100" value="0" class="w100"></div>' +
    '<div><label class="f">Propina $</label><input id="cProp" type="number" min="0" value="0" class="w100"></div>' +
    '<div><label class="f">Forma de pago</label><select id="cMet" class="w100"><option>Efectivo</option><option>Tarjeta</option><option>Transferencia</option></select></div>' +
    '<div><label class="f">Pagó con $ (efectivo)</label><input id="cCon" type="number" min="0" class="w100"></div></div>' +
    '<div class="tot"><span>Total a cobrar</span><span id="cTot"></span></div><div id="cCambio" class="mut"></div>' +
    '<div class="foot"><button class="b" id="cNo">Regresar</button><button class="b p" id="cSi">✔ Cerrar venta e imprimir ticket</button></div>', { sticky: true });
  function calc(){
    var dp = Math.min(100, Math.max(0, num($('cDesc').value) || 0)), desc = r2(sub * dp / 100), prop = r2(num($('cProp').value) || 0);
    var tot = r2(sub - desc + prop), con = num($('cCon').value);
    $('cTot').textContent = money(tot);
    $('cCambio').textContent = con != null && $('cMet').value === 'Efectivo' ? (con >= tot ? 'Cambio: ' + money(con - tot) : 'Faltan ' + money(tot - con)) : '';
    return { descPct: dp, descuento: desc, propina: prop, total: tot, metodo: $('cMet').value, pagoCon: con, cambio: con != null && con >= tot ? r2(con - tot) : 0 };
  }
  ['cDesc', 'cProp', 'cCon', 'cMet'].forEach(function(id){ $(id).oninput = calc; });
  calc();
  $('cNo').onclick = md.close;
  $('cSi').onclick = function(){
    var p = calc();
    if (p.metodo === 'Efectivo' && p.pagoCon != null && p.pagoCon < p.total) return alert('El pago en efectivo no cubre el total.');
    this.disabled = true;
    cerrarVenta(o, sub, p).then(function(v){ md.close(); if (OM) OM.close(); verTicket(v, true); })
      .catch(function(e){ alert('No se pudo registrar la venta: ' + e.message); $('cSi').disabled = false; });
  };
}
function consumoDe(items){
  var agg = {};
  items.forEach(function(it){
    var m = S.menu.find(function(x){ return x.id === it.menuId; });
    if (!m) return;
    var v = it.varId ? E.variantes(m).find(function(x){ return x.id === it.varId; }) : null;
    (m.receta || []).concat(v && v.receta || []).forEach(function(r){ if (r.insumoId && r.cant > 0) agg[r.insumoId] = (agg[r.insumoId] || 0) + r.cant * it.cant; });
  });
  return agg;
}
function moverInventario(agg, signo, tipo, ref, ts){
  return Promise.all(Object.keys(agg).map(function(id){
    var c = signo * agg[id];
    return Promise.all([Store.inc('insumos', id, 'existencia', c), Store.put('movimientos', { id: Store.uid(), fecha: ts || Date.now(), insumoId: id, tipo: tipo, cantidad: c, ref: ref })]);
  }));
}
function cerrarVenta(o, sub, p){
  var o2 = getOrden(o.id) || o; // lo más reciente
  return Store.nextFolio().then(function(folio){
    var items = o2.items.map(function(i){ return { menuId: i.menuId, varId: i.varId || null, nombre: i.nombre, precio: i.precio, tipo: i.tipo || 'alimento', categoria: i.categoria || '', cant: i.cant, nota: i.nota || '' }; });
    var consumo = consumoDe(items);
    var v = Object.assign({ id: Store.uid(), folio: folio, fecha: Date.now(), estado: 'pagada', tipo: o2.tipo, mesa: o2.mesa || '', cliente: o2.cliente || '', mesero: o2.mesero || '',
      personas: o2.personas || null, pedidoId: o2.pedidoId || null, items: items, subtotal: sub, consumo: consumo }, p);
    // Primero se guarda la venta; hasta entonces se toca inventario y se cierra la orden.
    return Store.put('ventas', v).then(function(){ return moverInventario(consumo, -1, 'venta', 'Ticket ' + folio, v.fecha); })
      .then(function(){ if (o2.pedidoId) return Store.put('pedidos', { id: o2.pedidoId, estado: 'entregado' }); })
      .then(function(){ return Store.del('ordenes', o2.id); })
      .then(function(){ return v; });
  });
}
function verTicket(v, auto){

function accionPedido(a, id){
  var p = S.pedidos.find(function(x){ return x.id === id; }); if (!p) return;
  if (a === 'aceptar') {
    var o = { id: Store.uid(), tipo: 'linea', mesa: '', cliente: p.cliente, pedidoId: p.id, abierta: Date.now(),

var pedVistos = null;
function avisoPedidos(){
  var nuevos = S.pedidos.filter(function(p){ return p.estado === 'nuevo'; }).map(function(p){ return p.id; });
  if (pedVistos === null) { pedVistos = new Set(nuevos); return; }

// X minutos antes de la hora (Configuración → Entregas, 25 por defecto)
// suena un aviso para empezar a prepararlo y que salga caliente.
function horaMenos(hhmm, min){ var p = String(hhmm).split(':'), t = (+p[0]) * 60 + (+p[1]) - min; t = (t + 1440) % 1440; return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); }
function momentoPreparar(p){
  if (!p.hora || p.entrega === 'domicilio') return null;
  var d = new Date(p.creado || Date.now()), h = String(p.hora).split(':');
  d.setHours(+h[0], +h[1], 0, 0);
  return d.getTime() - E.entregaCfg(S.config).avisoMin * 60000;

function prepararYa(p){ var t = momentoPreparar(p); return t != null && Date.now() >= t && ['nuevo', 'aceptado'].indexOf(p.estado) >= 0; }
function recordatorios(){
  var avisados = {};
  try { avisados = JSON.parse(localStorage.getItem('encino:avisados') || '{}') || {}; } catch(e){}
  var nuevos = S.pedidos.filter(function(p){ return prepararYa(p) && !avisados[p.id]; });
  if (!nuevos.length) return;
  nuevos.forEach(function(p){ avisados[p.id] = Date.now(); toast('⏰ Preparar ya: ' + (p.cliente || 'pedido') + ' pasa a las ' + p.hora, 15000); });

function csvParse(txt){
  var rows = [], row = [], f = '', q = false;
  for (var i = 0; i < txt.length; i++) {
    var c = txt[i];
    if (q) { if (c === '"') { if (txt[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',' || c === ';') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && txt[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(x){ return x.trim(); }); });
}
function csvCell(v){ v = String(v == null ? '' : v); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function descargar(nombre, contenido, tipo){
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([contenido], { type: tipo || 'text/plain;charset=utf-8' })); a.download = nombre;
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportarMenuCSV(){

    return [i.nombre, i.categoria, i.tipo, i.precio, i.descripcion, (i.menus || []).join('|'), i.disponible !== false ? 'si' : 'no',
      E.variantes(i).map(function(v){ return v.nombre + '=' + v.precio; }).join('|')]; }));
  descargar('menu-encino.csv', '﻿' + lines.map(function(r){ return r.map(csvCell).join(','); }).join('\n'), 'text/csv;charset=utf-8');
}
function importarMenuCSV(file){

    var hd = rows[0].map(function(x){ return x.trim().toLowerCase(); }), ix = function(k){ return hd.indexOf(k); };
    if (ix('nombre') < 0 || ix('precio') < 0) return alert('El CSV debe tener al menos las columnas "nombre" y "precio".');

      // variantes: "Solos=95|Con pollo=120|Con tasajo=140"

        if (!n || pr == null) return null;

        return { id: prev ? prev.id : Store.uid(), nombre: n, precio: pr, receta: prev ? (prev.receta || []) : [] }; }).filter(Boolean) : null;
      if (vars && vars.length && pre == null) pre = Math.min.apply(null, vars.map(function(v){ return v.precio; }));
      if (!nom || pre == null) { err.push('Renglón ' + (k + 2)); return null; }
      var tipo = /beb/i.test(g('tipo')) ? 'bebida' : 'alimento';
      var ms = g('menus') ? g('menus').split(/[|/]/).map(function(s){ s = s.trim().toLowerCase();
        var m = S.config.menus.find(function(x){ return x.id === s || x.nombre.toLowerCase() === s; }); return m ? m.id : null; }).filter(Boolean) : null;
      var d = { id: ya ? ya.id : Store.uid(), nombre: nom, precio: pre };
      if (g('categoria')) d.categoria = g('categoria').toUpperCase();
      if (ix('tipo') >= 0 || !ya) d.tipo = tipo;
      if (g('descripcion')) d.descripcion = g('descripcion');
      if (ms) d.menus = ms; else if (!ya) d.menus = [];
      if (g('disponible')) d.disponible = !/^(no|0|false)$/i.test(g('disponible')); else if (!ya) d.disponible = true;
      if (vars && vars.length) d.variantes = vars;
      if (!ya) { d.enLinea = true; d.enCarta = true; d.receta = []; }
      ya ? act++ : nuevos++;
      return d;
    }).filter(Boolean);
    if (!confirm('Se van a agregar ' + nuevos + ' y actualizar ' + act + ' platillos (por nombre). Nada se borra.' + (err.length ? '\nSe omiten por falta de nombre/precio: ' + err.join(', ') : '') + '\n¿Continuar?')) return;

  };

}

$('modo').textContent = Store.mode === 'firebase' ? '☁️ Firebase' : '💻 Local';
function arrancar(){
  var cols = ['menu', 'insumos', 'ordenes', 'ventas', 'movimientos', 'compras', 'pedidos', 'preparaciones'];
  var ps = cols.map(function(c){ return Store.watch(c, function(arr){
    S[c] = arr;
    if (c === 'pedidos' && listo) avisoPedidos();
    if (c === 'ordenes' && OM) pintaOrden();
    if ((c === 'menu' || c === 'insumos') && OM) pintaItems();
    render(false);
  }); });
  ps.push(Store.watch('config', function(arr){ S.config = E.cfgFrom(arr); S.configDocs = arr.filter(function(d){ return d.id === 'general'; }); render(false); }));
  Promise.all(ps).then(function(){ listo = true; avisoPedidos(); render(true); normalizarCategorias(); recordatorios(); });
  setInterval(function(){ if (TAB === 'mesas' && !OM) render(false); }, 60000);
  setInterval(recordatorios, 30000);
}
window.onStoreError = function(c, err, escritura){
  if (err && err.code === 'permission-denied') toast('⚠️ Sin permiso para ' + (escritura ? 'guardar en ' : 'leer ') + c + ': cierra sesión y vuelve a entrar.', 8000);
  else toast('⚠️ No se pudo ' + (escritura ? 'guardar' : 'leer') + ' (' + c + '): ' + errTxt(err), 8000);
};
Store.init().then(function(){
  if (Store.mode !== 'firebase') return arrancar();
  Store.auth().onAuthStateChanged(function(u){
    if (u) { if (!listo) arrancar(); return; }
    if (listo) { location.reload(); return; } // la sesión terminó: empezar limpio
    $('main').innerHTML = '<div id="login" class="card"><h2>Iniciar sesión</h2><label class="f">Correo</label><input id="lE" type="email" class="w100"><label class="f">Contraseña</label><input id="lP" type="password" class="w100"><p id="lErr" class="small" style="color:var(--bad)"></p><button class="b p" id="lOk">Entrar</button></div>';
    var go = function(){ Store.auth().signInWithEmailAndPassword($('lE').value.trim(), $('lP').value).catch(function(e){ $('lErr').textContent = 'No se pudo entrar: ' + e.message; }); };
    $('lOk').onclick = go; $('lP').onkeydown = function(e){ if (e.key === 'Enter') go(); };
  });
});
})();
</script>
</body>
</html>
