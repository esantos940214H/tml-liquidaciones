<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ordenar en línea — Restaurante Encino</title>
<style>
:root{--bg:#f7f3ec;--card:#fffdf8;--ink:#2b2a26;--mut:#7a7466;--acc:#4f6b3a;--acc2:#3d5530;--line:#e4dccd;--bad:#a23b2a}
@media (prefers-color-scheme:dark){:root{--bg:#171a15;--card:#1f231c;--ink:#ece8df;--mut:#a9a392;--acc:#a8c48c;--acc2:#bcd6a2;--line:#343a2f;--bad:#e08b7a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 120px}
h1{margin:0;color:var(--acc);font-family:Georgia,serif;font-size:1.8rem;text-align:center}
.sub{text-align:center;color:var(--mut);font-size:.85rem;margin:4px 0 14px}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;padding:6px 0 10px}
.tabs button{line-height:1.25;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.hoja{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 16px 10px;margin:8px 0}
.cat{margin:0}
.cat h3{display:flex;align-items:center;gap:12px;margin:18px 0 4px;font-size:.9rem;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.cat h3::before,.cat h3::after{content:"";flex:1;height:1px;background:var(--line)}
.paq{background:var(--card);border:2px dashed var(--acc);border-radius:14px;padding:4px 16px 8px;margin:12px 0}
.it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:0}
.it .n{flex:1;font-weight:600}.it .d{display:block;font-weight:400;color:var(--mut);font-size:.85rem}
.it .p{font-weight:700;white-space:nowrap}
.it.var{padding:6px 0 6px 14px}.it.var .n{font-weight:400}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1.1rem;cursor:pointer}
.qty b{min-width:18px;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:12px;align-items:center}
.btn{background:var(--acc);color:var(--bg);border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-size:1rem;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
label{display:block;font-size:.8rem;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:10px}.row>*{flex:1}
.st{font-size:1.2rem;font-weight:700;text-align:center;margin:10px 0}
.mut{color:var(--mut)}.bad{color:var(--bad)}
a{color:var(--acc)}
.mapa{height:260px;border-radius:10px;border:1px solid var(--line);margin-top:8px;z-index:0}
.ok{color:var(--acc)}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>
<body>
<div class="wrap" id="app"><p class="sub">Cargando…</p></div>
<div class="bar" id="bar" hidden><div class="in"><div style="flex:1"><b id="barTot">$0.00</b><div class="mut" id="barN" style="font-size:.8rem"></div></div><button class="btn" id="barBtn">Continuar</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script src="comun.js"></script>
<script>
(function(){
  var E = Encino, esc = E.esc, money = E.money;
  var menu = [], cfg = E.cfgFrom([]), cart = {}, paso = 'menu', menuSel = null, menuElegido = false, miPedido = null;
  try { miPedido = localStorage.getItem('encino:miPedido'); } catch(e){}
  var app = document.getElementById('app'), bar = document.getElementById('bar');

  function items(){ return menu.filter(function(i){ return i.disponible !== false && i.enLinea !== false; }); }
  // El carrito usa claves "idPlatillo" o "idPlatillo|idVariante"
  function linea(key){
    var p = key.split('|'), m = menu.find(function(x){ return x.id === p[0]; }); if (!m) return null;
    var v = p[1] ? E.variantes(m).find(function(x){ return x.id === p[1]; }) : null;
    if (p[1] && !v) return null;
    return { menuId: m.id, varId: v ? v.id : null, nombre: m.nombre + (v ? ' · ' + v.nombre : ''), precio: Number(v ? v.precio : m.precio) || 0, tipo: m.tipo };
  }
  function total(){ var t = 0; Object.keys(cart).forEach(function(k){ var l = linea(k); if (l) t += l.precio * cart[k]; }); return t; }
  function qtyBtns(key, sinMas){ var q = cart[key] || 0; return '<span class="qty">' + (q ? '<button data-menos="' + key + '">−</button><b>' + q + '</b>' : '') + '<button data-mas="' + key + '"' + (sinMas ? ' disabled style="opacity:.35"' : '') + '>+</button></span>'; }
  // Paquetes: solo se pueden agregar tantos como platillos que acepten paquete haya en el carrito
  function esPaqKey(k){ var m = menu.find(function(x){ return x.id === k.split('|')[0]; }); return !!(m && m.esPaquete); }
  function cupoPaquetes(){
    var np = 0, nd = 0;
    Object.keys(cart).forEach(function(k){ var m = menu.find(function(x){ return x.id === k.split('|')[0]; }); if (!m) return;
      if (m.esPaquete) np += cart[k]; else if (E.paquetesPara(m, menu).length) nd += cart[k]; });
    return { np: np, nd: nd, libre: nd - np };
  }
  // Si se quitan platillos, se quitan también los paquetes que ya no tienen a qué ir
  function ajustarPaquetes(){
    var c = cupoPaquetes(), sobran = c.np - c.nd;
    Object.keys(cart).reverse().forEach(function(k){
      if (sobran <= 0 || !esPaqKey(k)) return;
      var q = Math.min(cart[k], sobran); cart[k] -= q; sobran -= q; if (cart[k] <= 0) delete cart[k];
    });
  }
  function nArt(){ return Object.keys(cart).reduce(function(s,k){ return s + cart[k]; }, 0); }

  function pinta(){
    if (paso === 'estado') return;
    if (!cfg.pedidosActivos) { app.innerHTML = '<h1>' + esc(cfg.nombre) + '</h1><div class="box st">Por el momento no estamos recibiendo pedidos en línea.</div><p style="text-align:center"><a href="carta.html">Ver el menú</a></p>'; bar.hidden = true; return; }
    if (paso === 'datos') return pintaDatos();
    if (!menuSel) { var a = E.menuActual(cfg); menuSel = a ? a.id : null; }
    var h = '<h1>' + esc(cfg.nombre) + '</h1><p class="sub">Ordena en línea' + (cfg.telefono ? ' · ' + esc(cfg.telefono) : '') + '</p><div class="tabs">';
    (cfg.menus || []).forEach(function(m){ h += '<button data-m="' + esc(m.id) + '"' + (m.id === menuSel ? ' class="on"' : '') + '>' + esc(m.nombre) + (E.diasCorto(m) ? '<small style="display:block;font-weight:400;font-size:.75rem;opacity:.8">' + esc(E.diasCorto(m)) + '</small>' : '') + '</button>'; });
    h += '</div>';
    // Ventana de cambio (dos menús en horario): el cliente elige
    var activos = E.menusActivos(cfg);
    if (!menuElegido && activos.length > 1) {
      h += '<div class="box" style="text-align:center;border:2px solid var(--acc)"><p style="margin:0 0 10px">Son las <b>' + E.hm(new Date()) + '</b> y estamos sirviendo dos menús. ¿Qué se te antoja?</p><div class="row">' +
        activos.map(function(m){ return '<button class="btn" data-m="' + esc(m.id) + '">' + esc(E.nombreCorto(m)) + '</button>'; }).join('') + '</div></div>';
    }
    var its = items().filter(function(i){ return E.enMenu(i, menuSel) && !i.esPaquete; });
    var paqs = items().filter(function(i){ return i.esPaquete && E.enMenu(i, menuSel); });
    var paqH = '', cupo = cupoPaquetes(), lleno = cupo.libre <= 0;
    paqs.forEach(function(p){
      var vs = E.variantes(p);
      paqH += '<div class="cat paq"><h3>🥐 ' + esc(p.nombre) + '</h3><p class="mut" style="margin:0 0 4px;font-size:.85rem">' + esc(p.descripcion || '') + (p.descripcion && !/[.!?]$/.test(p.descripcion.trim()) ? '.' : '') + ' Se agrega a un platillo de tu pedido (uno por platillo).</p>' +
        (!cupo.nd ? '<p style="margin:4px 0 8px;font-size:.85rem;color:var(--bad)">Agrega primero un platillo para poder hacerlo paquete.</p>'
          : lleno ? '<p class="mut" style="margin:4px 0 8px;font-size:.85rem">Ya tienes un paquete por cada platillo.</p>' : '') +
        (vs.length ? vs.map(function(v){ return '<div class="it var"><span class="n">' + esc(v.nombre) + '</span><span class="p">+' + money(v.precio) + '</span>' + qtyBtns(p.id + '|' + v.id, lleno) + '</div>'; }).join('')
          : '<div class="it"><span class="n">' + esc(p.nombre) + '</span><span class="p">+' + money(p.precio) + '</span>' + qtyBtns(p.id, lleno) + '</div>') + '</div>';
    });
    if (!its.length) h += '<div class="box mut">No hay platillos disponibles en este menú.</div>';
    if (its.length) h += '<div class="hoja">';
    E.porCategoria(its, cfg.categorias).forEach(function(g){
      h += '<div class="cat"><h3>' + esc(g.categoria) + '</h3>';
      g.items.forEach(function(i){
        var vs = E.variantes(i);
        if (!vs.length) {
          h += '<div class="it"><span class="n">' + esc(i.nombre) + (i.descripcion ? '<span class="d">' + esc(i.descripcion) + '</span>' : '') + '</span><span class="p">' + money(i.precio) + '</span>' + qtyBtns(i.id) + '</div>';
          return;
        }
        h += '<div class="it" style="border-bottom:0;padding-bottom:0"><span class="n">' + esc(i.nombre) + (i.descripcion ? '<span class="d">' + esc(i.descripcion) + '</span>' : '') + '</span></div>';
        vs.forEach(function(v, k){
          h += '<div class="it var"' + (k < vs.length - 1 ? ' style="border-bottom:0"' : '') + '><span class="n">' + esc(v.nombre) + '</span><span class="p">' + money(v.precio) + '</span>' + qtyBtns(i.id + '|' + v.id) + '</div>';
        });
      });
      h += '</div>';
    });
    if (its.length) h += '</div>' + paqH;
    app.innerHTML = h;
    pintaBar();
  }
  function pintaBar(){
    var n = nArt();
    bar.hidden = !n;
    document.getElementById('barTot').textContent = money(total());
    document.getElementById('barN').textContent = n + (n === 1 ? ' artículo' : ' artículos');
    document.getElementById('barBtn').textContent = paso === 'datos' ? 'Enviar pedido' : 'Continuar';
  }
  function pintaDatos(){
    var h = '<h1>' + esc(cfg.nombre) + '</h1><p class="sub">Revisa tu pedido</p><div class="box">';
    // platillos primero, paquetes al final
    var esPaq = function(k){ var m = menu.find(function(x){ return x.id === k.split('|')[0]; }); return m && m.esPaquete ? 1 : 0; };
    Object.keys(cart).sort(function(a, b){ return esPaq(a) - esPaq(b); }).forEach(function(k){ var l = linea(k); if (!l) return;
      h += '<div class="it"><span class="n">' + cart[k] + ' × ' + esc(l.nombre) + '</span><span class="p">' + money(l.precio * cart[k]) + '</span></div>'; });
    h += '<div class="it"><span class="n">Total</span><span class="p">' + money(total()) + '</span></div></div>';
    h += '<div class="box"><label>Nombre *</label><input id="fNom" autocomplete="name"><label>Teléfono *</label><input id="fTel" type="tel" autocomplete="tel">' +
      '<div class="row"><div><label>Entrega</label><select id="fTipo"><option value="recoger">Paso a recoger</option><option value="domicilio">A domicilio</option></select></div>' +
      '<div id="horaBox"><label>¿A qué hora pasas? (opcional)</label><input id="fHora" type="time"></div></div>' +
      '<div id="dirBox" hidden>' + (E.entregaCfg(cfg).ok ? '<label>¿Dónde entregamos? *</label><button class="btn" id="miUbic" type="button" style="width:100%">📍 Usar mi ubicación</button>' +
        '<div class="mapa" id="mapa"></div><p class="mut" style="font-size:.8rem;margin:4px 0">También puedes tocar el mapa o arrastrar el pin.</p><p id="distInfo"></p>' : '') +
        '<label>Dirección y referencias *</label><textarea id="fDir" rows="2" placeholder="Calle, número, colonia, entre calles, color de la casa…"></textarea></div>' +
      '<label>Notas (sin cebolla, etc.)</label><textarea id="fNotas" rows="2"></textarea><p id="fErr" class="bad"></p>' +
      '<button class="btn" id="volver" style="background:transparent;color:var(--acc);padding-left:0">← Seguir agregando</button></div>';
    app.innerHTML = h;
    document.getElementById('fTipo').onchange = function(){ document.getElementById('dirBox').hidden = this.value !== 'domicilio'; if (this.value === 'domicilio') iniciarMapa(); document.getElementById('horaBox').hidden = this.value === 'domicilio'; infoEntrega(); };
    document.getElementById('volver').onclick = function(){ paso = 'menu'; pinta(); };
    pintaBar();
  }
  // ── Ubicación de entrega (mapa) ──────────────────────────────────────
  var mapa = null, pin = null, ubic = null, ruta = null; // ruta: {clave, pendiente, km, porCalle}
  function iniciarMapa(){
    var e = E.entregaCfg(cfg), div = document.getElementById('mapa');
    if (!e.ok || !div) return;
    document.getElementById('miUbic').onclick = usarMiUbicacion;
    if (!window.L) { div.innerHTML = '<p class="mut" style="padding:10px">No se pudo cargar el mapa. Usa el botón de arriba.</p>'; return; }
    if (mapa) { mapa.remove(); mapa = null; pin = null; }
    mapa = L.map(div).setView(ubic ? [ubic.lat, ubic.lng] : [e.lat, e.lng], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(mapa);
    L.circle([e.lat, e.lng], { radius: e.radioKm * 1000, color: '#4f6b3a', weight: 1, fillOpacity: .06 }).addTo(mapa);
    L.circleMarker([e.lat, e.lng], { radius: 7, color: '#4f6b3a', fillColor: '#4f6b3a', fillOpacity: 1 }).addTo(mapa).bindTooltip(cfg.nombre);
    mapa.on('click', function(ev){ ponerUbic(ev.latlng.lat, ev.latlng.lng); });
    if (ubic) ponerUbic(ubic.lat, ubic.lng, true);
    setTimeout(function(){ mapa.invalidateSize(); }, 100);
  }
  function ponerUbic(lat, lng, sinDireccion){
    ubic = { lat: lat, lng: lng };
    if (mapa) {
      if (!pin) { pin = L.marker([lat, lng], { draggable: true, icon: E.pinIcono() }).addTo(mapa); pin.on('dragend', function(){ var q = pin.getLatLng(); ponerUbic(q.lat, q.lng); }); }
      else pin.setLatLng([lat, lng]);
    }
    calcularRuta();
    if (!sinDireccion) direccionDe(lat, lng);
  }
  // Distancia por calle (OpenRouteService); si no se puede, línea recta
  function calcularRuta(){
    if (!ubic) return;
    var e = E.entregaCfg(cfg), clave = ubic.lat.toFixed(5) + ',' + ubic.lng.toFixed(5);
    if (!e.orsKey) { ruta = { clave: clave, km: E.distanciaKm(e, ubic), porCalle: false }; infoEntrega(); return; }
    ruta = { clave: clave, pendiente: true }; infoEntrega();
    var destino = { lat: ubic.lat, lng: ubic.lng };
    E.rutaCalle(cfg, destino).then(function(r){ if (ruta && ruta.clave === clave) { ruta = { clave: clave, km: r.km, porCalle: true }; infoEntrega(); } },
      function(){ if (ruta && ruta.clave === clave) { ruta = { clave: clave, km: E.distanciaKm(e, destino), porCalle: false }; infoEntrega(); } });
  }
  function usarMiUbicacion(){
    var info = document.getElementById('distInfo');
    if (!navigator.geolocation) { info.innerHTML = '<span class="bad">Tu navegador no permite ubicar. Toca el mapa para marcar el lugar.</span>'; return; }
    info.textContent = 'Buscando tu ubicación…';
    navigator.geolocation.getCurrentPosition(function(pos){
      ponerUbic(pos.coords.latitude, pos.coords.longitude);
      if (mapa) mapa.setView([pos.coords.latitude, pos.coords.longitude], 16);
    }, function(){ info.innerHTML = '<span class="bad">No pudimos obtener tu ubicación (revisa que el permiso esté activado). Toca el mapa para marcar el lugar.</span>'; },
    { enableHighAccuracy: true, timeout: 15000 });
  }
  // Rellena la dirección con la calle aproximada (si el cliente no escribió nada)
  function direccionDe(lat, lng){
    var f = document.getElementById('fDir'); if (!f || f.value.trim()) return;
    fetch('https://nominatim.openstreetmap.org/reverse?format=json&zoom=18&accept-language=es&lat=' + lat + '&lon=' + lng)
      .then(function(r){ return r.json(); }).then(function(d){
        var a = d && d.address || {}, t = [[a.road, a.house_number].filter(Boolean).join(' '), a.suburb || a.neighbourhood || a.quarter].filter(Boolean).join(', ');
        if (t && !f.value.trim()) f.value = t + ' — ';
      }).catch(function(){});
  }
  // Distancia, tiempo y si está dentro de la zona. Devuelve null si no aplica.
  function estadoEntrega(){
    var e = E.entregaCfg(cfg), tipo = document.getElementById('fTipo');
    if (!tipo) return null;
    if (tipo.value !== 'domicilio') return { km: 0, eta: e.prepMin, dentro: true };
    if (!e.ok) return null;
    if (!ubic) return { falta: true };
    if (!ruta || ruta.pendiente) return { pendiente: true };
    var recta = E.distanciaKm(e, ubic);
    // El límite se mide por calle (si está activado y se pudo calcular) o en línea recta
    var kmLimite = ruta.porCalle && e.limitePorCalle ? ruta.km : recta;
    return { km: ruta.km, porCalle: ruta.porCalle, eta: E.etaMin(cfg, ruta.km, ruta.porCalle), dentro: kmLimite <= e.radioKm, kmLimite: kmLimite };
  }
  function infoEntrega(){
    var info = document.getElementById('distInfo'), st = estadoEntrega(), e = E.entregaCfg(cfg);
    if (!info || !st || st.falta) { if (info && st && st.falta) info.textContent = ''; return; }
    if (st.pendiente) { info.innerHTML = '<span class="mut">Calculando la ruta…</span>'; return; }
    var tipoKm = st.porCalle ? ' por calle' : '';
    info.innerHTML = st.dentro
      ? '<span class="ok">✔ A ' + st.km.toFixed(1) + ' km' + tipoKm + ' · llega en aprox. <b>' + E.etaTxt(st.eta) + '</b></span>'
      : '<span class="bad">✖ Está a ' + st.kmLimite.toFixed(1) + ' km' + (st.porCalle && e.limitePorCalle ? ' por calle' : '') + ' y solo entregamos hasta ' + e.radioKm + ' km. Puedes elegir "Paso a recoger".</span>';
  }
  function enviar(){
    var v = function(id){ return document.getElementById(id).value.trim(); };
    var err = document.getElementById('fErr');
    if (!v('fNom') || !v('fTel')) { err.textContent = 'Nombre y teléfono son obligatorios.'; return; }
    if (v('fTipo') === 'domicilio' && !v('fDir')) { err.textContent = 'Escribe la dirección de entrega.'; return; }
    var st = estadoEntrega();
    if (st && st.falta) { err.textContent = 'Marca en el mapa dónde entregamos (o toca "Usar mi ubicación").'; return; }
    if (st && st.pendiente) { err.textContent = 'Estamos calculando la ruta, intenta de nuevo en un segundo.'; return; }
    if (st && !st.dentro) { err.textContent = 'Esa ubicación está fuera de nuestra zona de entrega (' + E.entregaCfg(cfg).radioKm + ' km).'; return; }
    // Hora para recoger (a domicilio no se pide: sale en cuanto está listo)
    var hora = v('fTipo') === 'recoger' ? v('fHora') : '';
    if (hora && hora < E.hm(new Date())) { err.textContent = 'Esa hora ya pasó; elige una hora más tarde o déjala vacía para lo antes posible.'; return; }
    var lineas = Object.keys(cart).map(function(k){ var l = linea(k); return l ? Object.assign(l, { cant: cart[k] }) : null; }).filter(Boolean);
    var btn = document.getElementById('barBtn'); btn.disabled = true;
    var p = { id: Store.uid(), estado: 'nuevo', creado: Date.now(), cliente: v('fNom'), telefono: v('fTel'), entrega: v('fTipo'),
      direccion: v('fTipo') === 'domicilio' ? v('fDir') : '', hora: hora, notas: v('fNotas'), items: lineas, total: total() };
    if (st && !hora) { p.etaMin = st.eta; if (v('fTipo') === 'domicilio' && ubic) { p.ubicacion = { lat: +ubic.lat.toFixed(6), lng: +ubic.lng.toFixed(6) }; p.distanciaKm = Math.round(st.km * 10) / 10; p.porCalle = !!st.porCalle; p.trayectoMin = E.trayectoMin(cfg, st.km, st.porCalle); } }
    Store.put('pedidos', p).then(function(){
      try { localStorage.setItem('encino:miPedido', p.id); } catch(e){}
      cart = {}; verEstado(p.id);
    }).catch(function(e){ btn.disabled = false; err.textContent = 'No se pudo enviar: ' + e.message; });
  }
  var ESTADOS = { nuevo: '⏳ Recibido — esperando confirmación del restaurante', aceptado: '👨‍🍳 Confirmado, en preparación', listo: '✅ ¡Listo! Ya puedes pasar / va en camino',
    entregado: '🎉 Entregado. ¡Gracias!', rechazado: '❌ El restaurante no pudo tomar tu pedido' };
  // "Listo" y "entregado" se dicen distinto si es a domicilio o para recoger
  function textoEstado(p){
    var dom = p.entrega === 'domicilio';
    if (p.estado === 'listo') return dom ? '✅ ¡Tu pedido está listo! El repartidor sale en unos minutos' : '✅ ¡Tu pedido está listo! Ya puedes pasar por él';
    if (p.estado === 'enCamino') return '🛵 ¡Tu pedido va en camino!';
    if (p.estado === 'entregado') return dom ? '🎉 ¡Pedido entregado! Buen provecho' : '🎉 ¡Pedido recogido! Buen provecho';
    return ESTADOS[p.estado];
  }
  function verEstado(id){
    paso = 'estado'; bar.hidden = true;
    Store.watchDoc('pedidos', id, function(p){
      if (!p) { app.innerHTML = '<div class="box">No encontramos tu pedido.</div>'; return; }
      app.innerHTML = '<h1>' + esc(cfg.nombre) + '</h1><div class="box"><p class="mut" style="text-align:center">Pedido #' + esc(p.id.slice(-5).toUpperCase()) + ' · ' + esc(p.cliente) + '</p><div class="st">' + (textoEstado(p) || esc(p.estado)) + '</div>' +
        (p.motivo ? '<p style="text-align:center" class="mut">' + esc(p.motivo) + '</p>' : '') +
        '<p style="text-align:center">Total: <b>' + money(p.total) + '</b></p>' +
        (p.etaMin && ['nuevo', 'aceptado'].indexOf(p.estado) >= 0 ? '<p style="text-align:center" class="mut">' + (p.entrega === 'domicilio' ? '🛵 Tiempo estimado de entrega: ' : '⏱️ Listo en aprox. ') + '<b>' + E.etaTxt(p.etaMin) + '</b></p>' : '') +
        (E.llegadaAprox(cfg, p) ? '<p style="text-align:center">🕒 Llega aprox. a las <b>' + E.hm(new Date(E.llegadaAprox(cfg, p))) + '</b></p>' : '') +
        (p.hora && ['nuevo', 'aceptado'].indexOf(p.estado) >= 0 ? '<p style="text-align:center" class="mut">⏰ Tu pedido estará listo para las <b>' + esc(p.hora) + '</b></p>' : '') + (cfg.telefono ? '<p style="text-align:center" class="mut">Dudas: ' + esc(cfg.telefono) + '</p>' : '') +
        '<p style="text-align:center"><button class="btn" id="nuevo">Hacer otro pedido</button></p></div>';
      document.getElementById('nuevo').onclick = function(){ try { localStorage.removeItem('encino:miPedido'); } catch(e){} location.reload(); };
    });
  }
  app.addEventListener('click', function(e){
    var t = e.target.closest('button'); if (!t) return;
    if (t.dataset.m) { menuSel = t.dataset.m; menuElegido = true; pinta(); }
    else if (t.dataset.mas) { if (esPaqKey(t.dataset.mas) && cupoPaquetes().libre <= 0) return; cart[t.dataset.mas] = (cart[t.dataset.mas] || 0) + 1; pinta(); }
    else if (t.dataset.menos) { var k = t.dataset.menos; cart[k]--; if (cart[k] <= 0) delete cart[k]; ajustarPaquetes(); pinta(); }
  });
  // No más paquetes que platillos a los que se les puede agregar
  function paquetesOk(){
    var np = 0, nd = 0;
    Object.keys(cart).forEach(function(k){ var m = menu.find(function(x){ return x.id === k.split('|')[0]; }); if (!m) return;
      if (m.esPaquete) np += cart[k]; else if (E.paquetesPara(m, menu).length) nd += cart[k]; });
    return np <= nd;
  }
  document.getElementById('barBtn').onclick = function(){
    if (!paquetesOk()) { alert('El paquete se agrega a un platillo: agrega al menos un platillo por cada paquete.'); return; }
    if (paso === 'menu') { paso = 'datos'; pinta(); window.scrollTo(0,0); } else enviar();
  };

  Store.init().then(function(){
    Store.watch('config', function(d){ cfg = E.cfgFrom(d); document.title = 'Ordenar en línea — ' + cfg.nombre; if (paso === 'menu') pinta(); });
    Store.watch('menu', function(d){ menu = d; if (paso === 'menu') pinta(); });
    if (miPedido) Store.get('pedidos', miPedido).then(function(p){ if (p && ['nuevo','aceptado','listo','enCamino'].indexOf(p.estado) >= 0) verEstado(p.id); }).catch(function(){});
  });
})();
</script>
</body>
</html>
