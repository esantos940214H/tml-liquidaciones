function mostrarMsg(texto,tipo){
  var el=$('msgLogin');

async function entrar(){
  var telefono=$('inTelefono').value.replace(/\D/g,'');
  var pin=$('inPin').value.trim();
  if(telefono.length!==10){ mostrarMsg('El teléfono debe tener 10 dígitos.','error'); return; }
  if(!/^\d{4}$/.test(pin)){ mostrarMsg('El PIN debe ser de 4 dígitos.','error'); return; }
  var btn=$('btnEntrar');
  btn.disabled=true; mostrarMsg('Verificando...','');
  try{
    var r=await fetch(FUNCTION_URL_LOGIN_OPERADOR,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({telefono:telefono,pin:pin})

    if(!r.ok||datos.error){ mostrarMsg(datos.error||'No se pudo entrar.','error'); btn.disabled=false; return; }
    await firebase.auth().signInWithCustomToken(datos.token);
    mostrarMsg('','');
  }catch(e){

}

// ══════════════════════════════════════════════════════════════════════
// EVIDENCIA DE MANIOBRAS — DUPLICADO del flujo de ing.html (misma sección,
// mismo criterio de emparejamiento: orden de embarque sellada por T.U.,
// recibo de maniobra por monto autorizado). Se copia tal cual en vez de
// compartir un módulo nuevo con ing.html para no arriesgar que un cambio
// aquí rompa el flujo de oficina o viceversa — si se ajusta el
// emparejamiento en ing.html, hay que reflejar el mismo cambio aquí.
//
// ÚNICA diferencia real: un operador SIN maestro:true solo puede
// emparejar contra pedidos de flete cuyo económico coincide con la unidad
// que tiene asignada HOY (ver restringirFletesAOperador) — así un
// operador nunca puede (por error o a propósito) subir evidencia de un
// viaje que no es el suyo. La cuenta "maestro" no tiene esa restricción:
// ve todos los pedidos, igual que la oficina.
// ══════════════════════════════════════════════════════════════════════
var OPERADORES=[];
var FLETES=[];
var ingresosDB=[];
var _miClaims=null;
var _verComoOperadorId=null; // solo para la cuenta maestro (ver "👁️ Ver como...")

// _claimsEfectivos(): las claims REALES (_miClaims) salvo que la cuenta
// maestro esté en modo "Ver como", en cuyo caso se simulan las claims de
// ese operador para que restringirFletesAOperador/poblarViajesDinero se
// comporten igual que para él — sin que la sesión real deje de ser
// maestro (ver el bloqueo en solicitarDinero, que sí usa _miClaims real).
function _claimsEfectivos(){
  if(_miClaims&&_miClaims.maestro&&_verComoOperadorId){
    return{rol:'operador',maestro:false,operadorId:_verComoOperadorId};
  }
  return _miClaims;
}

var _lazyScripts={};
function cargarScriptUnaVez(src){
  if(_lazyScripts[src])return _lazyScripts[src];
  _lazyScripts[src]=new Promise(function(resolve,reject){
    var s=document.createElement('script');
    s.src=src;s.onload=resolve;s.onerror=reject;
    document.head.appendChild(s);
  });
  return _lazyScripts[src];
}

const fmt=(n,d=2)=>'$'+parseFloat(n||0).toLocaleString('es-MX',{minimumFractionDigits:d,maximumFractionDigits:d});

var ECO_MAP_45XX={521:4521,522:4522,523:4523,524:4524,526:4526};
function normEconomico(eco){
  var n=parseInt(String(eco||'').replace(/[^0-9]/g,'')||0,10)||0;
  return ECO_MAP_45XX[n]||n;
}
function _normTxtFactManiobras(s){return(s||'').toString().trim().toUpperCase().replace(/\s+/g,' ');}
function _idsDeObservacionesFactManiobras(observaciones){
  return (observaciones||'').split('|').map(function(s){return _normTxtFactManiobras(s.replace(/^\s*[A-Z0-9]+:/,''));}).filter(function(s){return s;});
}
function _fleteTusNorm(f){
  var out=[];
  if(f.ordenEmbarque)out.push(_normTxtFactManiobras(f.ordenEmbarque));
  if(f.tu2)out.push(_normTxtFactManiobras(f.tu2));
  if(Array.isArray(f.tus))out=out.concat(f.tus.map(_normTxtFactManiobras));
  return out;
}
function matchFleteConAutorizacion(flete,autorizaciones){
  var tusNorm=_fleteTusNorm(flete);
  var pedNorm=flete.pedidoFlete?_normTxtFactManiobras(flete.pedidoFlete):'';
  var directo=autorizaciones.find(function(v){
    var vIds=_idsDeObservacionesFactManiobras(v.observaciones);
    return tusNorm.some(function(id){return id&&vIds.indexOf(id)!==-1;})||(pedNorm&&vIds.indexOf(pedNorm)!==-1);
  });
  if(directo)return{autorizacion:directo,metodo:'T.U./orden de embarque'};
  if(flete.economico){
    var porEconomico=autorizaciones.filter(function(v){
      return v.unidad===normEconomico(flete.economico)&&(v.fecha||'')===(flete.fecha||'');
    });
    if(porEconomico.length===1)return{autorizacion:porEconomico[0],metodo:'económico+fecha'};
  }
  var destinoNorm=_normTxtFactManiobras(flete.destino);
  var tiendaNorm=_normTxtFactManiobras(flete.tienda);
  if(!destinoNorm&&!tiendaNorm)return null;
  var candidatos=autorizaciones.filter(function(v){
    if((v.fecha||'')!==(flete.fecha||''))return false;
    var vDestino=_normTxtFactManiobras((v.ruta&&v.ruta[0]&&v.ruta[0].destino)||'');
    var vTienda=_normTxtFactManiobras(v.tienda||'');
    var matchDestino=destinoNorm&&vDestino&&(vDestino.indexOf(destinoNorm)!==-1||destinoNorm.indexOf(vDestino)!==-1);
    var matchTienda=tiendaNorm&&vTienda&&vTienda===tiendaNorm;
    return matchDestino||matchTienda;
  });
  if(candidatos.length===1)return{autorizacion:candidatos[0],metodo:'fecha+destino/tienda'};
  return null;
}

// restringirFletesAOperador: para un operador real (no maestro), recorta
// FLETES a solo los pedidos cuyo económico coincide con SU unidad
// asignada hoy — así nunca puede emparejar evidencia de un viaje ajeno.
function restringirFletesAOperador(claims){
  if(claims.maestro)return true; // sin restricción
  var miOp=OPERADORES.find(function(o){return o.operadorId===claims.operadorId;});
  if(!miOp){
    $('msgEvidencias').textContent='No tienes una unidad asignada en Flota — contacta a la oficina antes de subir evidencia.';
    $('msgEvidencias').className='msg error';
    return false;
  }
  FLETES=FLETES.filter(function(f){return f.economico&&normEconomico(f.economico)===miOp.unidad;});
  return true;
}

function _archivoABase64(file){
  return new Promise(function(resolve,reject){
    var r=new FileReader();
    r.onload=function(){resolve(String(r.result).split(',')[1]||'');};
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}
async function _paginasDeArchivo(file){
  var esPdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name||'');
  if(!esPdf)return[{blob:file,mimeType:file.type||'image/jpeg'}];
  if(!window.pdfjsLib){
    await cargarScriptUnaVez('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js');
    window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js';
  }
  var buf=await file.arrayBuffer();
  var pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
  var paginas=[];
  for(var i=1;i<=pdf.numPages;i++){
    var page=await pdf.getPage(i);
    var viewport=page.getViewport({scale:2.2});
    var canvas=document.createElement('canvas');
    canvas.width=viewport.width;canvas.height=viewport.height;
    await page.render({canvasContext:canvas.getContext('2d'),viewport:viewport}).promise;
    var blob=await new Promise(function(resolve){canvas.toBlob(resolve,'image/jpeg',0.92);});
    paginas.push({blob:blob,mimeType:'image/jpeg'});
  }
  return paginas;
}
async function _procesarUnaOrdenEmbarque(blob,mimeType){

function _recortarImagenPorPorcentaje(file,recorte){
  return new Promise(function(resolve){
    if(!recorte||[recorte.x0,recorte.y0,recorte.x1,recorte.y1].some(function(v){return v==null||isNaN(parseFloat(v));})){resolve(file);return;}
    var img=new Image();
    var urlTmp=URL.createObjectURL(file);
    img.onload=function(){
      URL.revokeObjectURL(urlTmp);
      try{
        var margen=1.5;
        var x0=Math.max(0,parseFloat(recorte.x0)-margen),y0=Math.max(0,parseFloat(recorte.y0)-margen);
        var x1=Math.min(100,parseFloat(recorte.x1)+margen),y1=Math.min(100,parseFloat(recorte.y1)+margen);
        if(x1<=x0||y1<=y0){resolve(file);return;}
        var sx=img.naturalWidth*(x0/100),sy=img.naturalHeight*(y0/100);
        var sw=img.naturalWidth*((x1-x0)/100),sh=img.naturalHeight*((y1-y0)/100);
        var canvas=document.createElement('canvas');
        canvas.width=sw;canvas.height=sh;
        canvas.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,sw,sh);
        canvas.toBlob(function(blob){resolve(blob||file);},'image/jpeg',0.9);
      }catch(e){resolve(file);}
    };
    img.onerror=function(){URL.revokeObjectURL(urlTmp);resolve(file);};
    img.src=urlTmp;
  });
}
async function _procesarUnReciboManiobra(blob,mimeType){
  var base64=await _archivoABase64(blob);
  var r=await fetch(FUNCTION_URL_RECIBO_MANIOBRA,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({archivoBase64:base64,mimeType:mimeType})
  });
  var data=await r.json();
  if(data.error)return'⚠️ '+data.error;
  var res=data.resultado||{};
  var monto=parseFloat(res.monto||0);
  if(!monto)return'⚠️ No se pudo leer el monto del recibo. Verifica la foto/página.';
  var autorizaciones=ingresosDB.filter(function(v){return v.esAutorizacionCliente;});
  var candidatos=FLETES.filter(function(f){
    if(f.reciboManiobraImgURL)return false;
    var m=matchFleteConAutorizacion(f,autorizaciones);
    var montoAut=m?m.autorizacion.subtotal:null;
    return montoAut!=null&&Math.abs(montoAut-monto)<0.5;
  });
  if(candidatos.length!==1){
    return candidatos.length===0
      ?'⚠️ No se encontró ningún pedido (de tu unidad) con monto autorizado de maniobra de '+fmt(monto)+' pendiente de recibo. Verifica el monto leído o avisa a la oficina.'
      :'⚠️ '+candidatos.length+' pedidos distintos tienen un monto autorizado de '+fmt(monto)+' — avisa a la oficina para asignarlo a mano.';
  }
  var f=candidatos[0];
  var archivoParaSubir=await _recortarImagenPorPorcentaje(blob,res.recorte);
  var seRecorto=archivoParaSubir!==blob;
  var ext=seRecorto?'jpg':(mimeType==='image/png'?'png':'jpg');
  var path='maniobras/recibos/'+f.ordenEmbarque+'_'+Date.now()+'.'+ext;
  var url=await TMLComprobantes.subirArchivo(path,archivoParaSubir);
  await actualizarEvidenciaManiobra(f.ordenEmbarque,{reciboManiobraImgURL:url,reciboManiobraMonto:monto});
  f.reciboManiobraImgURL=url;f.reciboManiobraMonto=monto;
  return'✅ Recibo de '+fmt(monto)+' asignado al T.U. '+f.ordenEmbarque+' ('+(f.destino||f.tienda||'')+')'+(seRecorto?' — recortado automático.':' — ⚠️ no se pudo recortar solo, se guardó la foto completa.');
}

// ══════════════════════════════════════════════════════════════════════
// SOLICITAR DINERO (Fase 3) — ligado a un viaje concreto. El candado real
// (evidencia completa + tope de 50% de comisión + un solo request por
// viaje) vive en el SERVIDOR (solicitarAnticipoOperador, functions/
// index.js) — esta pantalla solo arma la lista de viajes elegibles y
// muestra un tope INFORMATIVO calculado aquí mismo (con los datos que ya
// se cargaron), pero quien de verdad decide si se puede pedir es el
// servidor, para que no se pueda burlar el candado manipulando el
// navegador. Para la cuenta maestro no hay tope ni restricción de viaje
// único — ve TODOS los viajes, sin importar si ya tienen evidencia o si
// ya se les pidió dinero antes (autorización manual del dueño).
// ══════════════════════════════════════════════════════════════════════
function mostrarMsgDinero(texto,tipo){
  var el=$('msgDinero');
  el.textContent=texto||'';
  el.className='msg'+(tipo?(' '+tipo):'');
}
function comisionParaFlete(f){
  var op=OPERADORES.find(function(o){return o.unidad===normEconomico(f.economico);});
  return op?op.comision:12;
}
function topeDelViaje(f){
  if(!f.montoFlete)return null;
  return f.montoFlete*(comisionParaFlete(f)/100)*0.5;
}
var _viajeSeleccionado=null;
// dentroDeVentana36h: el dinero de un viaje solo se puede solicitar desde
// que se asigna (fechaAlta) y hasta 36 horas después — pasada esa ventana
// se deshabilita, sin importar si ya subió evidencia. Registros viejos sin
// fechaAlta no se bloquean por esto (nunca existió ese dato para ellos).
function dentroDeVentana36h(f){
  if(!f.fechaAlta)return true;
  return Date.now()<=new Date(f.fechaAlta).getTime()+36*60*60*1000;
}
function poblarViajesDinero(claims){
  var cont=$('listaViajesDinero');
  cont.innerHTML='';
  if(claims.maestro){
    // Vista del dueño: TODOS los viajes, sin filtrar por evidencia ni
    // ventana de tiempo — puede autorizar lo que considere, cuando sea.
    var elegibles=FLETES.slice();
    elegibles.sort(function(a,b){return(b.fecha||'').localeCompare(a.fecha||'');});
    if(!elegibles.length){
      cont.innerHTML='<div style="font-size:13px;color:#6f8ba6">No hay viajes registrados todavía.</div>';
      $('dineroEstado').textContent='';
      return;
    }
    $('dineroEstado').textContent='Elige el viaje y el monto que autorizas.';
    elegibles.forEach(function(f){
      var tieneEv=!!(f.ordenEmbarqueImgURL&&f.reciboManiobraImgURL);
      var estadoTxt=tieneEv?'✅ Evidencia subida':'Evidencia pendiente';
      if(f.anticipoOperadorSolicitado)estadoTxt+=' · ya se autorizó dinero antes';
      var div=document.createElement('div');
      div.className='viaje-card';
      div.innerHTML='<div><div class="destino">'+(f.destino||f.tienda||'(sin destino)')+'</div>'
        +'<div class="estado-ev">'+estadoTxt+'</div></div>'
        +'<button class="btn-icono" type="button" onclick="seleccionarViajeDinero(\''+f.ordenEmbarque+'\')">💵</button>';
      cont.appendChild(div);
    });
    return;
  }
  // Operador normal: "Mis viajes" es SOLO el checklist de evidencia
  // pendiente — un viaje desaparece de aquí en cuanto sube su evidencia
  // completa. Solicitar dinero ya no se hace desde esta lista: en cuanto
  // la evidencia de un viaje queda completa (ver subirOrdenEmbarqueSellada/
  // subirReciboManiobra → ofrecerSolicitudSiElegible), si sigue dentro de
  // la ventana de 36 horas desde que se asignó, se le ofrece ahí mismo.
  $('formSolicitud').style.display='none';
  var pendientes=FLETES.filter(function(f){return f.montoFlete>0&&!(f.ordenEmbarqueImgURL&&f.reciboManiobraImgURL);});
  pendientes.sort(function(a,b){return(b.fecha||'').localeCompare(a.fecha||'');});
  if(!pendientes.length){
    cont.innerHTML='<div style="font-size:13px;color:#4ade80">✅ No tienes evidencia pendiente.</div>';
    $('dineroEstado').textContent='';
    return;
  }
  var hoy=new Date().toISOString().slice(0,10);
  $('dineroEstado').textContent='Viajes con evidencia pendiente:';
  pendientes.forEach(function(f){
    var finalizado=!!(f.fecha&&f.fecha<=hoy);
    var div=document.createElement('div');
    div.className='viaje-card';
    div.innerHTML='<div><div class="destino">'+(f.destino||f.tienda||'(sin destino)')+'</div>'
      +'<div class="estado-ev'+(finalizado?' alerta':'')+'">'+(finalizado?'⚠️ Viaje finalizado sin evidencia':'Evidencia pendiente')+'</div></div>';
    cont.appendChild(div);
  });
}
// ofrecerSolicitudSiElegible: se llama justo después de subir cualquier
// evidencia — si con eso algún viaje (de los propios) quedó con evidencia
// COMPLETA, sin solicitud previa y todavía dentro de la ventana de 36h,
// se le abre de inmediato el formulario de solicitud para ese viaje (si no
// lo hace en este momento, pierde la oportunidad en cuanto se oculte de
// "Mis viajes" — no hay otro lugar desde donde pedirlo después).
function ofrecerSolicitudSiElegible(){
  var claims=_claimsEfectivos();
  if(!claims||claims.maestro)return;
  var candidato=FLETES.find(function(f){
    return f.montoFlete>0&&f.ordenEmbarqueImgURL&&f.reciboManiobraImgURL&&!f.anticipoOperadorSolicitado&&dentroDeVentana36h(f);
  });
  if(candidato){
    seleccionarViajeDinero(candidato.ordenEmbarque);
    mostrarMsgDinero('✅ Ya puedes solicitar dinero para este viaje.','ok');
  }
}
function seleccionarViajeDinero(ordenEmbarque){
  _viajeSeleccionado=ordenEmbarque;
  var f=FLETES.find(function(x){return x.ordenEmbarque===ordenEmbarque;});
  var tope=f?topeDelViaje(f):null;
  $('formSolicitud').style.display='block';
  $('lblViajeSeleccionado').textContent='Solicitar dinero — '+(f?(f.destino||f.tienda||ordenEmbarque):ordenEmbarque);
  if(_claimsEfectivos()&&_claimsEfectivos().maestro){
    $('topeInfo').textContent='Sin tope (autorización manual).';
    $('inMontoSolicitud').value='';
  }else{
    $('topeInfo').textContent=tope!=null?('Tope permitido para este viaje: '+fmt(tope)):'';
    $('inMontoSolicitud').value=tope!=null?tope.toFixed(2):'';
  }
  mostrarMsgDinero(_verComoOperadorId?'🔍 Vista previa — no se puede enviar de verdad desde el modo maestro.':'','');
}
async function actualizarEstadoDinero(claims){
  if(!claims)return;
  $('bloqueDinero').style.display='block';
  poblarViajesDinero(claims);
  $('bloqueBitacoras').style.display='block';
  poblarBitacoras(claims);
}
async function solicitarDinero(){
  if(_verComoOperadorId){
    mostrarMsgDinero('🔍 Estás en modo "Ver como..." — esto es solo una vista previa, no se puede enviar de verdad. Para probar el envío real, entra con la cuenta de ese operador (teléfono+PIN).','error');
    return;
  }
  var ordenEmbarque=_viajeSeleccionado;
  var importe=parseFloat($('inMontoSolicitud').value);
  if(!ordenEmbarque){mostrarMsgDinero('Elige un viaje.','error');return;}
  if(!importe||importe<=0){mostrarMsgDinero('Captura un monto válido.','error');return;}
  $('btnSolicitar').disabled=true;
  mostrarMsgDinero('Enviando...','');
  try{
    var idToken=await firebase.auth().currentUser.getIdToken();
    var r=await fetch(FUNCTION_URL_SOLICITAR_ANTICIPO,{
      method:'POST',headers:{'Authorization':'Bearer '+idToken,'Content-Type':'application/json'},
      body:JSON.stringify({ordenEmbarque:ordenEmbarque,importe:importe})
    });
    var d=await r.json();
    if(!r.ok||d.error){mostrarMsgDinero(d.error||'No se pudo enviar la solicitud.','error');$('btnSolicitar').disabled=false;return;}
    mostrarMsgDinero('✅ Solicitud enviada. La oficina la va a procesar.','ok');
    $('inMontoSolicitud').value='';
    FLETES=await cargarFletes(true);
    restringirFletesAOperador(_claimsEfectivos());
    poblarViajesDinero(_claimsEfectivos());
  }catch(e){
    mostrarMsgDinero('Sin conexión. Intenta de nuevo.','error');
    $('btnSolicitar').disabled=false;
  }
}

// BITÁCORA DE HORAS DE SERVICIO (NOM-087-SCT-2-2017) — ícono 🕐 por viaje,
// solo si ya tiene datos de carta porte (f.cartaPorte, ver
// _extraerRutaYHorariosCartaPorte en ing.html). Esta lista NO desaparece

// ══════════════════════════════════════════════════════════════════════
var ETIQUETAS_BITACORA={

var _bitacoraOrden=null,_bitacoraEventos=[],_bitacoraInterval=null;
// _operadorIdDeFlete: a qué operador corresponde un viaje, por el

async function abrirBitacora(ordenEmbarque){
  _bitacoraOrden=ordenEmbarque;
  var f=FLETES.find(function(x){return x.ordenEmbarque===ordenEmbarque;});
  var cp=(f&&f.cartaPorte)||{};
  var claims=_claimsEfectivos();
  var operadorId=(claims&&!claims.maestro)?claims.operadorId:(_verComoOperadorId||_operadorIdDeFlete(f));
  var op=operadorId?OPERADORES.find(function(o){return o.operadorId===operadorId;}):null;
  var encabezado=
    '<strong>Mudanzas TML, S.A. de C.V.</strong> · Autotransporte Carga Federal<br>'+
    'Conductor: '+(op?op.nombre:'(sin identificar)')+(op&&op.licencia?' · Lic. '+op.licencia+(op.licenciaVigencia?' (vig. '+op.licenciaVigencia+')':''):'')+'<br>'+
    'Unidad: '+(op?op.unidad:'—')+(op&&op.placa?' · Placas '+op.placa:'')+(op&&op.marca?' · '+op.marca+(op.modelo?' '+op.modelo:''):'')+'<br>'+
    'Origen: '+(cp.origen||'—')+(cp.horaSalida?' ('+cp.horaSalida+')':'')+'<br>'+
    (cp.puntosIntermedios&&cp.puntosIntermedios.length?('Puntos intermedios: '+cp.puntosIntermedios.join(', ')+'<br>'):'')+
    'Destino: '+(cp.destino||'—')+(cp.horaLlegada?' ('+cp.horaLlegada+')':'');
  $('bitEncabezado').innerHTML=encabezado;
  $('modalBitacora').style.display='flex';
  _aspectoIdx=0;
  $('bitPagina1').style.display='block';
  $('bitPagina2').style.display='none';
  $('txtVoltear').textContent='Ver aspectos relevantes (reverso)';
  await _cargarEventosBitacora();
  _actualizarEstadoBitacora();
  if(_bitacoraInterval)clearInterval(_bitacoraInterval);
  _bitacoraInterval=setInterval(_actualizarEstadoBitacora,30000);
}
function cerrarBitacora(){
  $('modalBitacora').style.display='none';
  if(_bitacoraInterval){clearInterval(_bitacoraInterval);_bitacoraInterval=null;}
  _bitacoraOrden=null;
}
// voltearBitacora: "voltea" el modal entre anverso (bitácora en curso) y
// reverso (aspectos relevantes de la norma) — igual que una licencia
// digital que se voltea para ver el reverso.
function voltearBitacora(){
  var enPagina1=$('bitPagina1').style.display!=='none';
  $('bitPagina1').style.display=enPagina1?'none':'block';
  $('bitPagina2').style.display=enPagina1?'block':'none';
  $('txtVoltear').textContent=enPagina1?'Volver a la bitácora (anverso)':'Ver aspectos relevantes (reverso)';
  if(enPagina1)_renderAspecto();
}
// ASPECTOS_RELEVANTES: reverso del formato oficial — texto tal cual del PDF
// de referencia (NOM-087-SCT-2-2017), sin parafrasear, para no arriesgar
// cambiar el sentido de la norma. Se navega uno por uno con las flechitas
// circulares, como pidió el dueño ("como en las licencias digitales").
var ASPECTOS_RELEVANTES=[
  {numeral:'3.4. Excepciones temporales.',texto:'Es el tiempo que podrá prolongarse la duración de la conducción y del tiempo de servicio ininterrumpido, así como reducciones de la duración del descanso diario en las siguientes situaciones: en caso de percance vial, de avería del vehículo, de perturbación del servicio o alguna otra circunstancia que ocasione interrupción del tráfico por la vía que se transite, situaciones que deberán ser evidenciadas documentalmente; así como, cuando sea necesario asegurar el funcionamiento de servicios de interés público con carácter de urgente y excepcional.'},
  {numeral:'3.5. Actividades auxiliares.',texto:'Cualquier trabajo distinto al de la conducción, para el mismo u otro permisionario, dentro o fuera del sector transporte, citando de forma enunciativa mas no limitativa: carga o descarga, limpieza y mantenimiento técnico, tareas que tengan como objeto garantizar la seguridad de la carga, tiempo dedicado a cumplir con las obligaciones legales vinculadas directamente con una operación de transporte (aduanal, administrativo, entre otros) y carga de combustible.'},
  {numeral:'3.6. Pausa.',texto:'Periodo comprendido dentro del tiempo de servicio durante el cual, el conductor no lleva a cabo ninguna tarea de conducción o las definidas como otras actividades auxiliares.'},
  {numeral:'4.1.',texto:'Todo conductor debe realizar una pausa de 30 minutos cuando: a) Ha conducido hasta cinco horas continuas, o bien; b) Esta pausa podrá distribuirse durante un lapso de cinco horas y media de acuerdo a las condiciones de la ruta.'},
  {numeral:'4.2.',texto:'Los periodos de pausa, en ningún caso podrán ser acumulables.'},
  {numeral:'4.6.',texto:'En rutas que impliquen una conducción máxima de 14 horas, el conductor debe tener una pausa no menor a 8 horas continuas, sin menoscabo de cumplir con las pausas mínimas establecidas en los numerales 4.1 y 4.2 de la presente Norma.'},
  {numeral:'4.7.',texto:'El tiempo máximo de conducción en 24 horas nunca podrá exceder las 14 horas.'},
  {numeral:'7.1. Vigilancia',texto:'La vigilancia del cumplimiento de esta Norma Oficial Mexicana corresponde a la Secretaría de Comunicaciones y Transportes y a la Secretaría de Gobernación, a través de la Policía Federal, en el ámbito de sus atribuciones.'},
  {numeral:'8.3.1.',texto:'La Secretaría, sin perjuicio de las atribuciones que tiene conferidas la Secretaría de Gobernación, a través de la Policía Federal, verificará la bitácora de horas de servicio a través de sus distintas Unidades Administrativas y de acuerdo con las facultades que cada una tiene conferidas.'}
];
var _aspectoIdx=0;
function _renderAspecto(){
  var a=ASPECTOS_RELEVANTES[_aspectoIdx];
  $('aspectoNumeral').textContent=a.numeral;
  $('aspectoTexto').textContent=a.texto;
  $('aspectoContador').textContent=(_aspectoIdx+1)+' / '+ASPECTOS_RELEVANTES.length;
}
function aspectoAnterior(){_aspectoIdx=(_aspectoIdx-1+ASPECTOS_RELEVANTES.length)%ASPECTOS_RELEVANTES.length;_renderAspecto();}
function aspectoSiguiente(){_aspectoIdx=(_aspectoIdx+1)%ASPECTOS_RELEVANTES.length;_renderAspecto();}
async function _cargarEventosBitacora(){
  var doc=await db.collection('bitacoras').doc(_bitacoraOrden).get();
  _bitacoraEventos=(doc.exists&&Array.isArray(doc.data().eventos))?doc.data().eventos:[];
  _renderLogBitacora();
  _renderGridBitacora();
}
function _renderLogBitacora(){
  var cont=$('bitLog');
  if(!_bitacoraEventos.length){cont.innerHTML='<div style="color:#6f8ba6">Sin eventos registrados todavía.</div>';return;}
  cont.innerHTML=_bitacoraEventos.slice().reverse().map(function(e){
    var ini=new Date(e.inicio).toLocaleString('es-MX',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'});
    var fin=e.fin?new Date(e.fin).toLocaleString('es-MX',{hour:'2-digit',minute:'2-digit'}):'(en curso)';
    return '<div style="padding:4px 0;border-bottom:1px solid #1e3247">'+(ETIQUETAS_BITACORA[e.tipo]||e.tipo)+' — '+ini+' → '+fin+'</div>';
  }).join('');
}
// CATEGORIAS_GRID: las 5 filas del formato oficial (anverso del PDF de la
// SCT) — mapean cada botón/tipo de evento a la fila que le corresponde,
// tal como agrupa el propio formato en "ACTIVIDADES AUXILIARES" y "CASOS
// DE EXCEPCIÓN" (ver el reverso del PDF, numerales 3.4/3.5). No es una
// réplica exacta del PDF (celda por celda con firmas, etc.) — es una
// cuadrícula equivalente en pantalla, que es lo que pidió el dueño
// ("con que se pueda visualizar es suficiente").
var CATEGORIAS_GRID=[
  {label:'CONDUCIENDO',tipos:['conduciendo']},
  {label:'PAUSA',tipos:['pausa']},
  {label:'ACTIVIDADES AUXILIARES',tipos:['carga','descarga','retenes']},
  {label:'CASOS DE EXCEPCIÓN',tipos:['descompostura','percance_vial','bloqueo_carretero','eventos_climatologicos']},
  {label:'DESCANSO',tipos:['descanso']}
];
function _diaLocalISO(iso){
  var d=new Date(iso);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function _renderGridBitacora(){
  var cont=$('bitGrid');
  if(!_bitacoraEventos.length){cont.innerHTML='<div style="color:#6f8ba6;font-size:12px">Sin eventos registrados todavía.</div>';return;}
  var dias={};
  _bitacoraEventos.forEach(function(e){
    var dia=_diaLocalISO(e.inicio);
    if(!dias[dia])dias[dia]=true;
  });
  var diasOrdenados=Object.keys(dias).sort();
  var html='';
  diasOrdenados.forEach(function(dia,idx){
    var inicioDia=new Date(dia+'T00:00:00').getTime();
    html+='<div style="font-size:11px;font-weight:600;margin-top:'+(idx?'12px':'0')+'">DÍA '+(idx+1)+' — '+dia+'</div>';
    html+='<div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:9px;margin-top:4px;width:100%">';
    html+='<tr><td></td>';
    for(var h=1;h<=24;h++)html+='<td style="text-align:center;padding:1px;color:#6f8ba6">'+h+'</td>';
    html+='<td style="text-align:center;padding:1px 4px;color:#6f8ba6">TOT</td></tr>';
    CATEGORIAS_GRID.forEach(function(cat){
      html+='<tr><td style="padding:2px 4px;white-space:nowrap;color:#cdd9e4">'+cat.label+'</td>';
      var horasActivas=0;
      for(var h=1;h<=24;h++){
        var celdaIni=inicioDia+(h-1)*3600000,celdaFin=inicioDia+h*3600000;
        var activo=_bitacoraEventos.some(function(e){
          if(cat.tipos.indexOf(e.tipo)===-1)return false;
          var eIni=new Date(e.inicio).getTime();
          var eFin=e.fin?new Date(e.fin).getTime():Date.now();
          return eIni<celdaFin&&eFin>celdaIni;
        });
        if(activo)horasActivas++;
        html+='<td style="text-align:center;padding:1px;background:'+(activo?'#4da3ff':'transparent')+'">'+(activo?'●':'')+'</td>';
      }
      html+='<td style="text-align:center;padding:1px 4px;color:#9fb3c8">'+horasActivas+'h</td></tr>';
    });
    html+='</table></div>';
  });
  cont.innerHTML=html;
}
async function registrarEventoBitacora(tipo){
  if(!_bitacoraOrden)return;
  var ahora=new Date().toISOString();
  var ref=db.collection('bitacoras').doc(_bitacoraOrden);
  await db.runTransaction(async function(tx){
    var snap=await tx.get(ref);
    var eventos=(snap.exists&&Array.isArray(snap.data().eventos))?snap.data().eventos:[];
    if(eventos.length&&!eventos[eventos.length-1].fin)eventos[eventos.length-1].fin=ahora;
    eventos.push({tipo:tipo,inicio:ahora,fin:null});
    tx.set(ref,{ordenEmbarque:_bitacoraOrden,eventos:eventos},{merge:true});
  });
  await _cargarEventosBitacora();
  _actualizarEstadoBitacora();
}
// _actualizarEstadoBitacora: refleja el estatus actual y calcula los AVISOS
// (nunca bloqueos) basados en NOM-087-SCT-2-2017 — art. 4.1 (pausa de 30
// min tras 5h continuas conduciendo) y art. 4.7 (máximo 14h conduciendo en
// 24h). Son solo avisos informativos: las excepciones del art. 3.4
// (percance vial, avería, clima, etc.) las decide el conductor/
// permisionario, este módulo no puede juzgar esas situaciones solo.
function _actualizarEstadoBitacora(){
  if(!_bitacoraEventos.length){$('bitEstadoActual').textContent='Sin iniciar';$('bitAlerta').textContent='';return;}
  var ultimo=_bitacoraEventos[_bitacoraEventos.length-1];
  var minDesde=Math.floor((Date.now()-new Date(ultimo.inicio).getTime())/60000);
  $('bitEstadoActual').textContent=(ETIQUETAS_BITACORA[ultimo.tipo]||ultimo.tipo)+' — '+Math.floor(minDesde/60)+'h '+(minDesde%60)+'min';

  var minConduciendoContinuo=0;
  for(var i=_bitacoraEventos.length-1;i>=0;i--){
    var e=_bitacoraEventos[i];
    if(e.tipo==='pausa'||e.tipo==='descanso')break;
    if(e.tipo==='conduciendo'){
      var fin=e.fin?new Date(e.fin).getTime():Date.now();
      minConduciendoContinuo+=(fin-new Date(e.inicio).getTime())/60000;
    }
  }
  var hace24h=Date.now()-24*60*60*1000;
  var minConduciendo24h=_bitacoraEventos.filter(function(e){return e.tipo==='conduciendo';}).reduce(function(s,e){
    var ini=new Date(e.inicio).getTime();
    if(ini<hace24h)return s;
    var fin=e.fin?new Date(e.fin).getTime():Date.now();
    return s+(fin-ini)/60000;
  },0);

  var alertas=[];
  if(minConduciendoContinuo>=5*60)alertas.push('⚠️ Llevas '+Math.floor(minConduciendoContinuo/60)+'h conduciendo sin pausa — toma tu pausa de 30 min (art. 4.1 NOM-087).');
  if(minConduciendo24h>=14*60)alertas.push('⚠️ Ya llevas '+Math.floor(minConduciendo24h/60)+'h conduciendo en las últimas 24h — el máximo permitido es 14h (art. 4.7 NOM-087).');
  $('bitAlerta').innerHTML=alertas.join('<br>');
}

firebase.auth().onAuthStateChanged(async function(usuario){
  var btn=$('btnEntrar');
  if(btn)btn.disabled=false;
  if(!usuario){
    $('panelLogin').style.display='block';
    $('panelBienvenida').style.display='none';
    $('bloqueEvidencias').style.display='none';
    return;
  }
  var token=await usuario.getIdTokenResult();
  if(token.claims.rol!=='operador'){
    // Sesión de otro tipo de usuario (staff) abierta por error en este módulo.
    mostrarMsg('Esta cuenta no tiene acceso de operador.','error');
    firebase.auth().signOut();
    return;
  }
  $('panelLogin').style.display='none';
  $('panelBienvenida').style.display='block';
  var etiqueta=token.claims.maestro?'Modo maestro':'Bienvenido';
  $('txtNombre').textContent=etiqueta+(usuario.displayName?(', '+usuario.displayName):'');
  iniciarEvidencias(token.claims);
});

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw-operador.js').catch(function(e){console.error('sw-operador:',e);});
}
